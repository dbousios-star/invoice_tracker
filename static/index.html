<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Τιμές Τιμολογίων</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .spinner { border: 4px solid rgba(37,99,235,.2); border-top-color: #2563eb; border-radius: 50%;
               width: 48px; height: 48px; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">

  <header class="sticky top-0 z-20 bg-blue-600 text-white px-4 py-3 shadow">
    <h1 class="text-lg font-semibold">📊 Τιμές Τιμολογίων</h1>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-4 pb-28">
    <!-- Global message area -->
    <div id="alert" class="hidden mb-4 rounded-xl p-4 text-sm font-medium"></div>

    <!-- ============ SCAN TAB ============ -->
    <section id="tab-scan" data-tab>
      <div id="scan-actions" class="space-y-3">
        <label class="flex items-center justify-center gap-2 w-full rounded-2xl bg-blue-600 active:bg-blue-700 text-white text-lg font-semibold py-6 shadow-lg cursor-pointer select-none">
          📷 Φωτογράφιση / Επιλογή Τιμολογίου
          <input id="file-camera" type="file" accept="image/*" capture="environment" class="hidden">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center gap-2 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 py-4 font-medium cursor-pointer select-none">
            🖼️ Συλλογή / PDF
            <input id="file-pick" type="file" accept="image/*,application/pdf" multiple class="hidden">
          </label>
          <button id="btn-qr" class="rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 py-4 font-medium">
            🔍 Σκανάρισμα Μόνο QR
          </button>
        </div>
        <p id="pending-qr" class="hidden text-sm text-blue-700 dark:text-blue-300"></p>
      </div>

      <!-- QR reader -->
      <div id="qr-box" class="hidden mt-4 rounded-2xl overflow-hidden bg-black">
        <div id="qr-reader" class="w-full"></div>
        <button id="btn-qr-stop" class="w-full py-4 bg-slate-800 text-white font-medium">✖ Κλείσιμο κάμερας</button>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden flex-col items-center gap-4 py-12">
        <div class="spinner"></div>
        <p id="loading-text" class="text-base font-medium">Ανάγνωση QR...</p>
      </div>

      <!-- Batch progress -->
      <div id="batch" class="mt-4"></div>

      <!-- Results -->
      <div id="results" class="mt-4"></div>
    </section>

    <!-- ============ HISTORY TAB ============ -->
    <section id="tab-history" data-tab class="hidden">
      <select id="supplier-filter" class="w-full mb-4 rounded-xl p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-base">
        <option value="">Όλοι οι προμηθευτές</option>
      </select>
      <div id="history-list" class="space-y-2"></div>
    </section>

    <!-- ============ PRODUCTS TAB ============ -->
    <section id="tab-products" data-tab class="hidden">
      <input id="product-search" type="search" placeholder="Αναζήτηση προϊόντος ή κωδικού..."
             class="w-full mb-4 rounded-xl p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-base">
      <div id="product-results" class="space-y-3"></div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed bottom-0 inset-x-0 z-20 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 grid grid-cols-3"
       style="padding-bottom: env(safe-area-inset-bottom)">
    <button data-nav="scan" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">📷</span>Σάρωση</button>
    <button data-nav="history" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">🧾</span>Ιστορικό</button>
    <button data-nav="products" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">📦</span>Προϊόντα</button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
