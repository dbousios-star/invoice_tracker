<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Τιμές Τιμολογίων</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <script>
    // Apply saved/OS theme before first paint (no flash)
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .spinner { border: 4px solid rgba(37,99,235,.2); border-top-color: #2563eb; border-radius: 50%;
               width: 48px; height: 48px; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen">

  <header class="sticky top-0 z-20 bg-blue-600 text-white px-4 py-3 shadow flex items-center justify-between">
    <h1 class="text-lg font-semibold">📊 Τιμές Τιμολογίων</h1>
    <button id="theme-toggle" class="w-10 h-10 rounded-full bg-white/15 active:bg-white/25 text-xl" title="Αλλαγή θέματος" aria-label="Αλλαγή θέματος">🌙</button>
  </header>

  <main class="max-w-2xl md:max-w-6xl mx-auto px-4 pt-4 pb-28">
    <!-- Global message area -->
    <div id="alert" class="hidden mb-4 rounded-xl p-4 text-sm font-medium"></div>

    <!-- ============ SCAN TAB ============ -->
    <section id="tab-scan" data-tab class="md:max-w-2xl md:mx-auto">
      <div id="scan-actions" class="space-y-3">
        <label class="flex items-center justify-center gap-2 w-full rounded-2xl bg-blue-600 active:bg-blue-700 text-white text-lg font-semibold py-6 shadow-lg cursor-pointer select-none">
          📷 Φωτογράφιση / Επιλογή Τιμολογίου
          <input id="file-camera" type="file" accept="image/*" capture="environment" class="hidden">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center gap-2 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 py-4 font-medium cursor-pointer select-none">
            🖼️ Συλλογή / PDF
            <input id="file-pick" type="file" accept="image/*,application/pdf" multiple class="hidden">
          </label>
          <button id="btn-qr" class="rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 py-4 font-medium">
            🔍 Σκανάρισμα Μόνο QR
          </button>
        </div>
        <p id="pending-qr" class="hidden text-sm text-blue-700 dark:text-blue-300"></p>
      </div>

      <!-- QR reader -->
      <div id="qr-box" class="hidden mt-4 rounded-2xl overflow-hidden bg-black">
        <div id="qr-reader" class="w-full"></div>
        <button id="btn-qr-stop" class="w-full py-4 bg-slate-800 text-white font-medium">✖ Κλείσιμο κάμερας</button>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden flex-col items-center gap-4 py-12">
        <div class="spinner"></div>
        <p id="loading-text" class="text-base font-medium">Ανάγνωση QR...</p>
      </div>

      <!-- Batch progress -->
      <div id="batch" class="mt-4"></div>

      <!-- Results -->
      <div id="results" class="mt-4"></div>
    </section>

    <!-- ============ HISTORY TAB ============ -->
    <section id="tab-history" data-tab class="hidden">
      <!-- grid lives on an inner wrapper so the tab's own `hidden` is never overridden by md:grid -->
      <div class="md:grid md:grid-cols-12 md:gap-6 md:items-start">
        <div class="md:col-span-5">
          <div class="flex gap-2 mb-4">
            <select id="supplier-filter" class="flex-1 min-w-0 rounded-xl p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-base">
              <option value="">Όλοι οι προμηθευτές</option>
            </select>
            <label class="shrink-0 flex items-center gap-2 px-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium cursor-pointer select-none has-[:checked]:border-red-400 has-[:checked]:bg-red-50 dark:has-[:checked]:bg-red-950/40">
              <input id="only-increases" type="checkbox" class="w-4 h-4 accent-red-600">
              ⚠️ Μόνο με αυξήσεις
            </label>
          </div>
          <div id="history-list" class="space-y-2"></div>
        </div>
        <!-- Desktop split-view report panel -->
        <div id="history-report" class="hidden md:block md:col-span-7 md:sticky md:top-20">
          <div class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-10 text-center text-slate-500">
            Επιλέξτε τιμολόγιο από τη λίστα για να δείτε τη σύγκριση τιμών.
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PRODUCTS TAB ============ -->
    <section id="tab-products" data-tab class="hidden md:max-w-2xl md:mx-auto">
      <input id="product-search" type="search" placeholder="Αναζήτηση προϊόντος ή κωδικού..."
             class="w-full mb-4 rounded-xl p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-base">
      <div id="top-increases" class="space-y-2"></div>
      <div id="product-results" class="space-y-3"></div>
    </section>
  </main>

  <!-- Invoice file viewer (image / PDF) -->
  <div id="file-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col" role="dialog" aria-modal="true" aria-label="Προβολή τιμολογίου">
    <div class="flex items-center justify-between gap-2 p-3 text-white">
      <span class="font-semibold">📄 Τιμολόγιο</span>
      <div class="flex gap-2">
        <button id="file-zoom" class="hidden px-4 h-11 rounded-lg bg-white/15 active:bg-white/25 font-semibold">🔍 200%</button>
        <button id="file-close" class="w-11 h-11 rounded-lg bg-white/15 active:bg-white/25 text-xl" aria-label="Κλείσιμο">✕</button>
      </div>
    </div>
    <div id="file-content" class="flex-1 overflow-auto"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-50 max-w-[90vw] px-4 py-3 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-lg text-sm font-medium"></div>

  <!-- Bottom navigation -->
  <nav class="fixed bottom-0 inset-x-0 z-20 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 grid grid-cols-3"
       style="padding-bottom: env(safe-area-inset-bottom)">
    <button data-nav="scan" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">📷</span>Σάρωση</button>
    <button data-nav="history" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">🧾</span>Ιστορικό</button>
    <button data-nav="products" class="py-3 flex flex-col items-center text-sm font-medium"><span class="text-2xl">📦</span>Προϊόντα</button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
